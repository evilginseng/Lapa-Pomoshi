<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — Лапа Помощи</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">

    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: linear-gradient(135deg, #F7F4F0 0%, #E8EFF8 50%, #F7E7CD 100%);
        }
        .auth-container { width: 100%; max-width: 460px; }

        .auth-logo { text-align: center; margin-bottom: 32px; }
        .auth-logo a { display: inline-flex; align-items: center; gap: 12px; }
        .auth-logo .brand-mark {
            width: 52px;
            height: 52px;
            border-radius: 16px;
            font-size: 24px;
        }
        .auth-logo .brand-text {
            font-family: var(--font-heading);
            font-size: 24px;
            font-weight: 700;
            color: var(--color-dark-green);
            line-height: 1;
            text-align: left;
        }
        .auth-logo .brand-text small {
            display: block;
            font-family: var(--font-body);
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            color: var(--color-muted);
            margin-top: 4px;
        }

        .auth-box {
            background: var(--color-white);
            border-radius: var(--radius-lg);
            padding: 48px 40px;
            box-shadow: var(--shadow-lg);
            position: relative;
            overflow: hidden;
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1),
                        transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .auth-box.visible {
            opacity: 1;
            transform: translateY(0);
        }
        .auth-box::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            background: linear-gradient(90deg,
                var(--color-blue) 0%,
                var(--color-green) 33%,
                var(--color-sand) 66%,
                var(--color-dark-green) 100%);
        }

        .auth-tabs {
            position: relative;
            display: flex;
            margin-bottom: 32px;
            background: var(--color-bg);
            padding: 6px;
            border-radius: 50px;
        }
        .auth-tabs::before {
            content: '';
            position: absolute;
            top: 6px;
            left: 6px;
            width: calc(50% - 6px);
            height: calc(100% - 12px);
            background: var(--color-white);
            border-radius: 50px;
            box-shadow: var(--shadow-md);
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 0;
        }
        .auth-tabs.register-active::before {
            transform: translateX(100%);
        }
        .auth-tab {
            flex: 1;
            padding: 12px;
            border-radius: 50px;
            border: none;
            background: transparent;
            font-family: var(--font-body);
            font-size: 14px;
            font-weight: 600;
            color: var(--color-muted);
            cursor: pointer;
            transition: color 0.3s ease;
            position: relative;
            z-index: 1;
        }
        .auth-tab.active { color: var(--color-dark-green); }

        .auth-forms { position: relative; overflow: hidden; }
        .auth-form { transition: opacity 0.4s ease, transform 0.4s ease; }
        .auth-form.hidden { display: none; }
        .auth-form.appearing {
            opacity: 0;
            transform: translateX(30px);
        }
        .auth-form.appearing-left {
            opacity: 0;
            transform: translateX(-30px);
        }
        .auth-form.appeared {
            opacity: 1;
            transform: translateX(0);
        }

        .auth-title { font-size: 28px; margin-bottom: 8px; text-align: center; }
        .auth-subtitle {
            font-size: 14px;
            color: var(--color-muted);
            text-align: center;
            margin-bottom: 32px;
        }

        .form-group { margin-bottom: 20px; text-align: left; }
        .form-label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: var(--color-dark-green);
            text-transform: uppercase;
            letter-spacing: 1.2px;
            margin-bottom: 8px;
        }
        .form-input {
            width: 100%;
            padding: 14px 18px;
            border-radius: var(--radius-sm);
            border: 1.5px solid var(--color-border);
            background: var(--color-bg);
            font-family: var(--font-body);
            font-size: 14px;
            font-weight: 500;
            color: var(--color-text);
            transition: var(--transition);
            outline: none;
        }
        .form-input:focus {
            border-color: var(--color-blue);
            background: var(--color-white);
            box-shadow: 0 0 0 4px rgba(150, 184, 228, 0.15);
        }

        .form-error-banner {
            display: none;
            background: rgba(232, 90, 90, 0.1);
            color: var(--color-red);
            border: 1.5px solid rgba(232, 90, 90, 0.3);
            border-radius: var(--radius-sm);
            padding: 12px 16px;
            font-size: 13.5px;
            font-weight: 500;
            margin-bottom: 20px;
            align-items: center;
            gap: 10px;
        }
        .form-error-banner.visible { display: flex; }
        .form-error-banner i { font-size: 15px; }

        .btn-submit {
            width: 100%;
            padding: 16px;
            border-radius: 50px;
            border: none;
            background: var(--color-blue);
            color: var(--color-white);
            font-family: var(--font-body);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 8px;
        }
        .btn-submit:hover {
            background: var(--color-blue-dark);
            transform: translateY(-2px);
            box-shadow: var(--shadow-blue);
        }

        .auth-hint {
            text-align: center;
            font-size: 13px;
            color: var(--color-muted);
            margin-top: 20px;
        }
        .auth-hint a { color: var(--color-blue-dark); font-weight: 600; }
        .auth-hint a:hover { color: var(--color-dark-green); }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: var(--color-dark-green);
            font-weight: 500;
            margin-top: 24px;
        }
        .back-link:hover { color: var(--color-blue-dark); }

        .form-hidden { display: none; }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="auth-logo">
            <a href="index.html">
                <div class="brand-mark"><i class="fa-solid fa-paw" aria-hidden="true"></i></div>
                <div class="brand-text">Лапа Помощи<small>Приют для животных</small></div>
            </a>
        </div>

        <div class="auth-box" id="authBox">
            <div class="auth-tabs" id="authTabs">
                <button class="auth-tab active" onclick="switchTab('login')">Вход</button>
                <button class="auth-tab" onclick="switchTab('register')">Регистрация</button>
            </div>

            <div class="auth-forms">

                <div id="loginForm" class="auth-form">
                    <h3 class="auth-title">С возвращением!</h3>
                    <p class="auth-subtitle">Войдите, чтобы продолжить помогать животным</p>

                    <div class="form-error-banner" id="loginErrorBanner">
                        <i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i>
                        <span id="loginErrorText"></span>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="loginEmail">Email</label>
                        <input type="email" class="form-input" id="loginEmail" placeholder="example@mail.ru">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="loginPassword">Пароль</label>
                        <input type="password" class="form-input" id="loginPassword" placeholder="••••••••">
                    </div>

                    <button class="btn-submit" onclick="doLogin()">
                        <i class="fa-solid fa-right-to-bracket" aria-hidden="true"></i> Войти
                    </button>

                    <p class="auth-hint">
                        Нет аккаунта?
                        <a href="#" onclick="switchTab('register'); return false;">Зарегистрируйтесь</a>
                    </p>
                </div>

                <div id="registerForm" class="auth-form hidden">
                    <h3 class="auth-title">Создать аккаунт</h3>
                    <p class="auth-subtitle">Присоединяйтесь к нам — это займёт минуту</p>

                    <div class="form-error-banner" id="registerErrorBanner">
                        <i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i>
                        <span id="registerErrorText"></span>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="regName">Имя</label>
                        <input type="text" class="form-input" id="regName" placeholder="Как к вам обращаться">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="regEmail">Email</label>
                        <input type="email" class="form-input" id="regEmail" placeholder="example@mail.ru">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="regPhone">Телефон</label>
                        <input type="tel" class="form-input" id="regPhone" placeholder="+7 (___) ___-__-__">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="regPassword">Пароль</label>
                        <input type="password" class="form-input" id="regPassword" placeholder="Минимум 6 символов">
                    </div>

                    <button class="btn-submit" onclick="doRegister()">
                        <i class="fa-solid fa-user-plus" aria-hidden="true"></i> Зарегистрироваться
                    </button>

                    <p class="auth-hint">
                        Уже есть аккаунт?
                        <a href="#" onclick="switchTab('login'); return false;">Войдите</a>
                    </p>
                </div>

            </div>
        </div>

        <div class="text-center">
            <a href="index.html" class="back-link">
                <i class="fa-solid fa-arrow-left" aria-hidden="true"></i> На главную
            </a>
        </div>
    </div>

    <script>
        const API_URL = 'https://lapa-pomoshi-12sn.onrender.com';

        function showFormError(formId, text) {
            const bannerId = formId === 'loginForm' ? 'loginErrorBanner' : 'registerErrorBanner';
            const textId   = formId === 'loginForm' ? 'loginErrorText'    : 'registerErrorText';
            const banner = document.getElementById(bannerId);
            const span   = document.getElementById(textId);
            if (!banner || !span) return;
            span.textContent = text;
            banner.classList.add('visible');
        }

        function hideFormError(formId) {
            const bannerId = formId === 'loginForm' ? 'loginErrorBanner' : 'registerErrorBanner';
            const banner = document.getElementById(bannerId);
            if (banner) banner.classList.remove('visible');
        }

        function showToast(text, type = 'success') {
            const old = document.querySelector('.toast-notification');
            if (old) old.remove();

            const toast = document.createElement('div');
            toast.className = 'toast-notification';

            const icons = { success: 'fa-circle-check', error: 'fa-circle-exclamation', info: 'fa-circle-info' };
            const colors = { success: '#466840', error: '#E85A5A', info: '#96B8E4' };
            toast.style.backgroundColor = colors[type] || colors.success;
            toast.innerHTML = `<i class="fa-solid ${icons[type] || icons.success}" aria-hidden="true"></i><span>${text}</span>`;

            document.body.appendChild(toast);
            setTimeout(() => toast.classList.add('show'), 50);
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 400);
            }, 2800);
        }

        let currentTab = 'login';

        function switchTab(tab) {
            if (tab === currentTab) return;

            const tabs = document.getElementById('authTabs');
            const tabButtons = document.querySelectorAll('.auth-tab');
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');

            if (tab === 'register') {
                tabs.classList.add('register-active');
                tabButtons[0].classList.remove('active');
                tabButtons[1].classList.add('active');
            } else {
                tabs.classList.remove('register-active');
                tabButtons[1].classList.remove('active');
                tabButtons[0].classList.add('active');
            }

            const slideFromRight = (tab === 'register');
            const oldForm = (tab === 'register') ? loginForm : registerForm;
            oldForm.classList.add(slideFromRight ? 'appearing-left' : 'appearing');

            setTimeout(() => {
                oldForm.classList.add('hidden');
                oldForm.classList.remove('appearing', 'appearing-left', 'appeared');

                const newForm = (tab === 'register') ? registerForm : loginForm;
                newForm.classList.remove('hidden');
                newForm.classList.add(slideFromRight ? 'appearing' : 'appearing-left');

                requestAnimationFrame(() => {
                    requestAnimationFrame(() => {
                        newForm.classList.remove('appearing', 'appearing-left');
                        newForm.classList.add('appeared');
                    });
                });

                hideFormError(tab === 'register' ? 'registerForm' : 'loginForm');
            }, 350);

            currentTab = tab;
        }

        async function doLogin() {
            const email    = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value.trim();

            hideFormError('loginForm');

            if (!email || !email.includes('@')) {
                showFormError('loginForm', 'Введите корректный email');
                return;
            }
            if (!password || password.length < 6) {
                showFormError('loginForm', 'Пароль должен быть минимум 6 символов');
                return;
            }

            try {
                const res = await fetch(`${API_URL}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();

                if (!res.ok) {
                    showFormError('loginForm', 'Неверная почта или пароль');
                    return;
                }

                localStorage.setItem('lapa_token', data.token);
                localStorage.setItem('lapa_user', JSON.stringify(data.user));

                showToast('Вы успешно вошли!', 'success');
                setTimeout(() => window.location.href = 'account.html', 800);
            } catch (err) {
                showFormError('loginForm', 'Сервер не отвечает. Подождите 30 секунд');
            }
        }

        async function doRegister() {
            const name     = document.getElementById('regName').value.trim();
            const email    = document.getElementById('regEmail').value.trim();
            const phone    = document.getElementById('regPhone').value.trim();
            const password = document.getElementById('regPassword').value.trim();

            hideFormError('registerForm');

            if (!name) { showFormError('registerForm', 'Укажите имя'); return; }
            if (!email || !email.includes('@')) { showFormError('registerForm', 'Введите корректный email'); return; }
            if (!phone) { showFormError('registerForm', 'Укажите телефон'); return; }
            if (!password || password.length < 6) { showFormError('registerForm', 'Пароль минимум 6 символов'); return; }

            try {
                const res = await fetch(`${API_URL}/api/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, phone, password })
                });

                const data = await res.json();

                if (!res.ok) {
                    showFormError('registerForm', data.error || 'Ошибка регистрации');
                    return;
                }

                localStorage.setItem('lapa_token', data.token);
                localStorage.setItem('lapa_user', JSON.stringify(data.user));

                showToast('Регистрация успешна!', 'success');
                setTimeout(() => window.location.href = 'account.html', 800);
            } catch (err) {
                showFormError('registerForm', 'Сервер не отвечает. Подождите 30 секунд');
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const box = document.getElementById('authBox');
            setTimeout(() => box.classList.add('visible'), 50);
        });
    </script>
</body>
</html>
